<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Siege Tourney</title>
<style>
  :root {
    --bg: #14121a; --panel: #1d1a26; --line: #2c2838; --text: #ece9f4; --dim: #8d88a0;
    --accent: #f0b43c; --good: #5dd39e; --bad: #ef6a6a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f4fa; --panel: #fff; --line: #e3dfee; --text: #1c1928; --dim: #6c6780; --accent: #b87a00; --good: #1f9d6b; --bad: #d64545; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 0 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; padding: 20px 0 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .chip { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }
  .spacer { flex: 1; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  nav button { background: none; border: 0; color: var(--dim); padding: 10px 14px; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; white-space: nowrap; border-radius: 0; }
  nav button.on { color: var(--text); border-color: var(--accent); }
  button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; }
  .rank { color: var(--dim); width: 28px; }
  .total { font-weight: 700; }
  .roster span { display: inline-block; margin: 0 6px 2px 0; padding: 1px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  .roster b { color: var(--accent); font-weight: 600; margin-left: 4px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .box h2 { font-size: 14px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin-bottom: 12px; }
  .pick label { display: flex; justify-content: space-between; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .pick label.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .pick input { display: none; }
  .dim { color: var(--dim); }
  .bad { color: var(--bad); } .good { color: var(--good); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  @media (max-width: 640px) { .hide-s { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Fantasy Siege Tourney</h1>
    <span class="chip" id="round"></span>
    <span class="chip" id="upd"><span class="live"></span>live</span>
    <span class="spacer"></span>
    <span id="who" class="dim"></span>
    <button id="auth"></button>
  </header>
  <nav id="tabs"></nav>
  <section id="view"></section>
</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="scoring.js"></script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TABLES = ["players", "rounds", "teams", "roster_history", "bonuses", "settings", "wizard_map", "round_swaps"];

let D = { players: [], rounds: [], teams: [], roster_history: [], bonuses: [], settings: { current_round: 1 }, wizard_map: [], round_swaps: [] };
let me = { allowed: false, admin: false, owner: null };
let loggedIn = false;
let tab = "teams";
let picked = new Set();
let allowedUsers = [];

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg; t.className = "show " + (bad ? "bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ""), 3500);
}

async function load() {
  const res = await Promise.all(TABLES.map((t) => sb.from(t).select("*")));
  const err = res.find((r) => r.error);
  if (err) return toast(err.error.message, true);
  TABLES.forEach((t, i) => (D[t] = t === "settings" ? res[i].data[0] : res[i].data));
  if (me.admin) { const r = await sb.from("allowed_users").select("*").order("label"); allowedUsers = r.data || []; }
  render();
}

async function loadMe() {
  const { data } = await sb.rpc("whoami");
  me = data || { allowed: false, admin: false, owner: null };
  const { data: { session } } = await sb.auth.getSession();
  loggedIn = !!session;
  const meta = session && session.user.user_metadata;
  $("who").textContent = meta ? meta.full_name || meta.name || "" : "";
  $("auth").textContent = session ? "Log out" : "Log in with Discord";
  $("auth").onclick = session
    ? () => sb.auth.signOut().then(() => location.reload())
    : () => sb.auth.signInWithOAuth({ provider: "discord", options: { redirectTo: location.origin + location.pathname } });
}

function scored() {
  const rounds = {};
  for (const r of D.rounds) rounds[r.round_no] = r;
  const byTeam = {};
  for (const h of D.roster_history) (byTeam[h.discord_id] ||= []).push(h);
  return Scoring.scoreAll({
    players: D.players, rounds, bonuses: D.bonuses, currentRound: D.settings.current_round,
    wizardMap: Object.fromEntries(D.wizard_map.map((m) => [m.wizard_id, m.player])), swaps: D.round_swaps,
    teams: D.teams.map((t) => ({ owner: t.owner, history: byTeam[t.discord_id] || [] })),
  });
}

const tabsFor = () => [["teams", "Teams"], ["players", "Players"], ["me", "My team"], ...(me.admin ? [["admin", "Admin"]] : [])];

function render() {
  const s = D.settings;
  const status = s.registration_open ? "registration open" : s.trading_open ? "trading open" : "";
  $("round").textContent = `Round ${s.current_round}${status ? " · " + status : ""}`;
  const last = D.rounds.map((r) => r.updated_at).sort().pop();
  $("upd").innerHTML = `<span class="live"></span>${last ? "updated " + new Date(last).toLocaleTimeString() : "waiting for data"}`;
  $("tabs").innerHTML = tabsFor().map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("");
  $("tabs").onclick = (e) => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
  const R = scored();
  $("view").innerHTML = { teams: viewTeams, players: viewPlayers, me: viewMe, admin: viewAdmin }[tab](R);
  if (tab === "me") bindMe();
  if (tab === "admin") bindAdmin();
}

function viewTeams(R) {
  if (!R.teams.length) return `<p class="dim">No teams yet.</p>`;
  return `<table><tr><th></th><th>Team</th><th>Roster</th><th class="n hide-s">Cost</th><th class="n">Points</th></tr>` +
    R.teams.map((t, i) => `<tr><td class="rank">${i + 1}</td><td>${esc(t.owner)}</td>
      <td class="roster">${t.roster.map((p) => `<span>${esc(p)}<b>${t.playerPts[p] || 0}</b></span>`).join("")}</td>
      <td class="n hide-s dim">${t.cost}</td><td class="n total">${t.total}</td></tr>`).join("") + `</table>`;
}

function viewPlayers(R) {
  return `<table><tr><th></th><th>Player</th><th class="n hide-s">Cost</th><th class="n">Off</th><th class="n">Def</th><th class="n hide-s">Offense</th><th class="n hide-s">Defense</th><th class="n hide-s">Bonus</th><th class="n">Points</th></tr>` +
    R.players.map((p, i) => `<tr><td class="rank">${i + 1}</td><td>${esc(p.name)}</td><td class="n hide-s dim">${p.cost}</td>
      <td class="n">${p.offW}-${p.offL}</td><td class="n">${p.defW}-${p.defL}</td>
      <td class="n hide-s">${p.offense}</td><td class="n hide-s">${p.defense}</td><td class="n hide-s">${p.bonus}</td><td class="n total">${p.total}</td></tr>`).join("") + `</table>`;
}

function viewMe() {
  if (!loggedIn) return `<p class="dim">Log in with Discord to enter.</p>`;
  if (!me.allowed) return `<p class="bad">Your Discord account is not on the entry list. Ask the organizer to add your Discord ID.</p>`;
  const s = D.settings;
  const mine = D.teams.find((t) => t.owner === me.owner);
  const cur = mine ? Scoring.rosterForRound({ history: D.roster_history.filter((h) => h.discord_id === mine.discord_id) }, s.current_round) : [];
  let html = `<div class="box"><h2>Your team ${cur.length ? "" : '<span class="dim">— none yet</span>'}</h2>
    <div class="roster">${cur.map((p) => `<span>${esc(p)}</span>`).join("")}</div></div>`;
  if (s.registration_open) {
    html += `<div class="box"><h2>Pick 4 players · <span id="spent">0</span> / 500</h2><div class="pick">` +
      D.players.slice().sort((a, b) => b.cost - a.cost).map((p) =>
        `<label data-p="${esc(p.name)}"><span>${esc(p.name)}</span><span class="dim">${p.cost}</span></label>`).join("") +
      `</div><button class="primary" id="submit">Submit team</button></div>`;
  } else if (s.trading_open && cur.length) {
    const opt = (list) => list.map((p) => `<option>${esc(p.name || p)}</option>`).join("");
    html += `<div class="box"><h2>Trade — equal or lesser value</h2><div class="row">
      <select id="tout">${opt(cur)}</select> → <select id="tin">${opt(D.players.filter((p) => !cur.includes(p.name)).sort((a, b) => b.cost - a.cost))}</select>
      <button class="primary" id="trade">Trade</button></div></div>`;
  } else html += `<p class="dim">Registration and trading are closed.</p>`;
  return html;
}

function bindMe() {
  const cost = (n) => D.players.find((p) => p.name === n).cost;
  const sync = () => {
    document.querySelectorAll(".pick label").forEach((l) => l.classList.toggle("on", picked.has(l.dataset.p)));
    if ($("spent")) $("spent").textContent = [...picked].reduce((s, n) => s + cost(n), 0);
  };
  document.querySelectorAll(".pick label").forEach((l) => l.onclick = () => {
    const n = l.dataset.p;
    if (picked.has(n)) picked.delete(n); else if (picked.size < 4) picked.add(n);
    sync();
  });
  sync();
  if ($("submit")) $("submit").onclick = () => rpc("submit_team", { p_roster: [...picked] }, "Team saved");
  if ($("trade")) $("trade").onclick = () => rpc("trade", { p_out: $("tout").value, p_in: $("tin").value }, "Trade done");
}

async function rpc(fn, args, ok) {
  const { error } = await sb.rpc(fn, args);
  if (error) return toast(error.message, true);
  toast(ok); load();
}

// Look-alike characters folded before matching, for suggestions only (an admin confirms).
function viewAccounts(R) {
  const rounds = D.rounds.map((r) => r.round_no);
  const rn = rounds.includes(D.settings.current_round) ? D.settings.current_round : Math.max(0, ...rounds);
  const raw = (D.rounds.find((r) => r.round_no === rn) || {}).wizards || {};
  const manual = Object.fromEntries(D.wizard_map.map((m) => [m.wizard_id, m.player]));
  const ids = Object.keys(raw);
  if (!ids.length) return `<div class="box"><h2>In-game accounts</h2><p class="dim" style="margin:0">No siege data yet.</p></div>`;
  const first = Scoring.firstNames(Object.fromEntries(D.rounds.map((r) => [r.round_no, r])));
  const auto = (id) => { const r = Scoring.resolveRound({ [id]: raw[id] }, D.players, {}, [], undefined, first); return Object.keys(r.wizards)[0] || ""; };
  const rows = ids.map((id) => ({ id, rec: raw[id], player: manual[id] || auto(id), isManual: !!manual[id] }))
    .sort((a, b) => !!a.player - !!b.player || a.rec.name.localeCompare(b.rec.name));
  const unmatched = rows.filter((r) => !r.player).length;
  return `<div class="box"><h2>In-game accounts · round ${rn} ${unmatched ? `<span class="bad">· ${unmatched} unmatched</span>` : ""}</h2><table>` +
    rows.map((r) => {
      const former = first[r.id] && first[r.id] !== r.rec.name ? first[r.id] : null;
      const sug = !r.player && Scoring.suggest(former || r.rec.name, D.players);
      return `<tr><td>${esc(r.rec.name)}${former ? ` <span class="dim">formerly ${esc(former)}</span>` : ""}</td><td class="dim hide-s">${esc(r.id)}</td><td class="n">${r.rec.off.w}-${r.rec.off.l}</td><td class="n">${r.rec.def.w}-${r.rec.def.l}</td>
        <td><select data-map="${esc(r.id)}"><option value="">${r.player ? "— (name match)" : "— unmatched"}</option>${D.players.map((p) =>
          `<option ${r.isManual && p.name === r.player ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
        ${!r.isManual && r.player ? `<span class="dim">→ ${esc(r.player)}</span>` : ""}
        ${sug ? `<button data-sug="${esc(r.id)}" data-p="${esc(sug)}">${esc(sug)} ✓</button>` : ""}</td></tr>`;
    }).join("") + `</table></div>`;
}

function viewAdmin(R) {
  const s = D.settings;
  const opts = D.players.map((p) => `<option>${esc(p.name)}</option>`).join("");
  return `<div class="box"><h2>Contest</h2><div class="row">
      Round <input id="a-round" type="number" min="1" value="${s.current_round}" style="width:80px">
      <label><input id="a-reg" type="checkbox" ${s.registration_open ? "checked" : ""}> registration open</label>
      <label><input id="a-trd" type="checkbox" ${s.trading_open ? "checked" : ""}> trading open</label>
      <button id="a-save">Save</button></div>
      <p class="dim" style="margin:0">Close trading before the round starts: live data is stored under the current round.</p></div>
    <div class="box"><h2>Add bonus</h2><div class="row">
      <select id="b-player">${opts}</select>
      <input id="b-round" type="number" min="1" value="${s.current_round}" style="width:80px" title="round">
      <input id="b-pts" type="number" value="10" style="width:80px" title="points">
      <input id="b-why" placeholder="reason (e.g. first 10-0, new tech)" style="flex:1;min-width:160px">
      <button class="primary" id="b-add">Add</button></div>
      <table>${D.bonuses.slice().sort((a, b) => b.id - a.id).map((b) =>
        `<tr><td>R${b.round_no}</td><td>${esc(b.player)}</td><td class="n">${b.points > 0 ? "+" : ""}${b.points}</td><td class="dim">${esc(b.reason)}</td><td class="n"><button data-del="${b.id}">×</button></td></tr>`).join("")}</table></div>
    ${viewAccounts(R)}
    <div class="box"><h2>Name swap</h2><div class="row">
      <select id="s-a">${opts}</select> ⇄ <select id="s-b">${opts}</select>
      <input id="s-round" type="number" min="1" value="${s.current_round}" style="width:80px" title="round">
      <button class="primary" id="s-add">Swap stats</button></div>
      <table>${D.round_swaps.map((w) => `<tr><td>R${w.round_no}</td><td>${esc(w.player_a)} ⇄ ${esc(w.player_b)}</td><td class="n"><button data-sdel="${w.id}">×</button></td></tr>`).join("")}</table></div>
    <div class="box"><h2>People (Discord IDs)</h2><div class="row">
      <input id="u-id" placeholder="Discord user ID" style="width:200px"><input id="u-name" placeholder="display name" style="width:160px">
      <label><input id="u-adm" type="checkbox"> admin</label><button class="primary" id="u-add">Add / update</button></div>
      <table>${allowedUsers.map((u) => `<tr><td>${esc(u.label)}</td><td class="dim">${esc(u.discord_id)}</td><td>${u.is_admin ? '<span class="good">admin</span>' : ""}</td><td class="n"><button data-udel="${esc(u.discord_id)}">×</button></td></tr>`).join("")}</table></div>`;
}

function bindAdmin() {
  const run = async (p, ok) => { const { error } = await p; if (error) return toast(error.message, true); toast(ok); load(); };
  $("a-save").onclick = () => run(sb.from("settings").update({
    current_round: +$("a-round").value, registration_open: $("a-reg").checked, trading_open: $("a-trd").checked }).eq("id", 1), "Saved");
  $("b-add").onclick = () => run(sb.from("bonuses").insert({
    player: $("b-player").value, round_no: +$("b-round").value, points: +$("b-pts").value, reason: $("b-why").value }), "Bonus added");
  $("u-add").onclick = () => run(sb.from("allowed_users").upsert({
    discord_id: $("u-id").value.trim(), label: $("u-name").value.trim(), is_admin: $("u-adm").checked }), "Saved");
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => run(sb.from("bonuses").delete().eq("id", b.dataset.del), "Removed"));
  document.querySelectorAll("[data-udel]").forEach((b) => b.onclick = () => run(sb.from("allowed_users").delete().eq("discord_id", b.dataset.udel), "Removed"));
  const map = (id, player) => run(player
    ? sb.from("wizard_map").upsert({ wizard_id: id, player })
    : sb.from("wizard_map").delete().eq("wizard_id", id), player ? `Mapped to ${player}` : "Mapping removed");
  document.querySelectorAll("[data-map]").forEach((s) => s.onchange = () => map(s.dataset.map, s.value));
  document.querySelectorAll("[data-sug]").forEach((b) => b.onclick = () => map(b.dataset.sug, b.dataset.p));
  $("s-add").onclick = () => run(sb.from("round_swaps").insert({
    round_no: +$("s-round").value, player_a: $("s-a").value, player_b: $("s-b").value }), "Swap added");
  document.querySelectorAll("[data-sdel]").forEach((b) => b.onclick = () => run(sb.from("round_swaps").delete().eq("id", b.dataset.sdel), "Swap removed"));
}

let t;
const reload = () => { clearTimeout(t); t = setTimeout(load, 250); };
const ch = sb.channel("contest");
TABLES.forEach((table) => ch.on("postgres_changes", { event: "*", schema: "public", table }, reload));
ch.subscribe();
sb.auth.onAuthStateChange(() => loadMe().then(load));
loadMe().then(load);
</script>
</body>
</html>
